<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Misiones · Frank & Valentina</title>
<meta name="theme-color" content="#0b0620" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  :root{
    --bg:#0b0620; --panel:#160c33; --ink:#f6f1ff; --muted:#a79cc9;
    --cyan:#00e5ff; --pink:#ff3d7f; --yellow:#ffd60a; --lime:#b6ff3b; --violet:#9d5cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Baloo 2',system-ui,sans-serif; color:var(--ink);
    background:
      radial-gradient(1000px 600px at 10% -10%, #3b0d6b 0%, transparent 60%),
      radial-gradient(900px 700px at 110% 10%, #00434f 0%, transparent 60%),
      radial-gradient(800px 800px at 50% 120%, #5a0b3a 0%, transparent 60%),
      var(--bg);
    background-attachment:fixed; overflow-x:hidden;
  }
  /* Estrellas de fondo */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #fff8, transparent),
      radial-gradient(2px 2px at 70% 60%, #0ff8, transparent),
      radial-gradient(1.5px 1.5px at 40% 80%, #ff8, transparent),
      radial-gradient(2px 2px at 85% 20%, #f0f8, transparent),
      radial-gradient(1.5px 1.5px at 10% 90%, #fff8, transparent);
    background-size:300px 300px; animation:twinkle 6s linear infinite alternate;
  }
  @keyframes twinkle{from{background-position:0 0}to{background-position:60px -40px}}
  .app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:18px 16px 60px}

  h1,h2,.bungee{font-family:'Bungee',cursive;letter-spacing:.5px}
  .brand{text-align:center;padding:14px 0 6px}
  .brand .kicker{display:inline-block;font-weight:800;font-size:13px;letter-spacing:4px;
    color:var(--yellow);background:#ffd60a22;border:2px solid var(--yellow);padding:4px 12px;border-radius:99px}
  .brand h1{font-size:clamp(34px,8vw,64px);line-height:1;margin-top:12px;
    background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink),var(--yellow));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px #9d5cff66)}
  .brand p{color:var(--muted);font-weight:700;margin-top:8px}

  /* Pantalla de selección */
  .pick-title{text-align:center;font-family:'Bungee';font-size:22px;margin:26px 0 18px;color:var(--lime)}
  .pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media (max-width:560px){.pick-grid{grid-template-columns:1fr}}
  .hero{
    position:relative;border-radius:28px;padding:26px 16px 22px;text-align:center;cursor:pointer;
    background:linear-gradient(180deg,var(--panel),#0e0626);
    border:3px solid var(--c);box-shadow:0 0 0 0 var(--c),0 14px 40px -10px var(--c);
    transition:transform .2s, box-shadow .2s; overflow:hidden;
  }
  .hero:hover,.hero:active{transform:translateY(-4px) rotate(-.5deg);box-shadow:0 0 0 6px #ffffff10,0 20px 50px -8px var(--c)}
  .hero .av{font-size:86px;line-height:1;filter:drop-shadow(0 6px 0 #0008);animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .hero .nm{font-family:'Bungee';font-size:28px;color:var(--c);margin-top:12px}
  .hero .sub{color:var(--muted);font-weight:700}
  .hero .tag{position:absolute;top:12px;right:12px;background:var(--c);color:#0b0620;
    font-weight:800;font-size:12px;padding:3px 10px;border-radius:99px}

  /* Barra superior del niño */
  .topbar{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,#1e0f44,#14082e);
    border:3px solid var(--c);border-radius:24px;padding:14px 16px;box-shadow:0 10px 30px -10px var(--c)}
  .topbar .av{font-size:50px;filter:drop-shadow(0 4px 0 #0008)}
  .topbar .info{flex:1;min-width:0}
  .topbar .hi{font-family:'Bungee';font-size:20px;color:var(--c)}
  .lvl{font-weight:800;font-size:14px;color:var(--yellow)}
  .xpbar{height:16px;border-radius:99px;background:#0a0420;border:2px solid #ffffff22;overflow:hidden;margin-top:6px}
  .xpfill{height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--pink),var(--violet));
    border-radius:99px;transition:width 1s cubic-bezier(.2,.9,.2,1);box-shadow:0 0 14px var(--pink)}
  .streak{text-align:center;background:#ff7a0022;border:2px solid #ff7a00;border-radius:18px;padding:8px 12px;min-width:84px}
  .streak b{display:block;font-family:'Bungee';font-size:24px;color:#ff9a2e}
  .streak span{font-weight:800;font-size:12px;color:#ffbb7a}
  .switch{background:none;border:2px solid #ffffff33;color:var(--muted);font-family:'Baloo 2';font-weight:800;
    border-radius:14px;padding:8px 10px;cursor:pointer}
  .switch:hover{color:var(--ink);border-color:#fff}

  .section-h{font-family:'Bungee';font-size:18px;margin:22px 0 12px;display:flex;align-items:center;gap:10px}
  .section-h::after{content:"";flex:1;height:3px;background:linear-gradient(90deg,var(--c),transparent);border-radius:9px}

  /* Misiones */
  .missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  .mission{
    position:relative;border-radius:24px;padding:18px;cursor:pointer;min-height:176px;
    background:linear-gradient(160deg,#211150,#120830);border:3px solid #ffffff1f;
    transition:transform .15s, border-color .2s, box-shadow .2s; overflow:hidden;
  }
  .mission:hover{transform:translateY(-3px);border-color:var(--c)}
  .mission:active{transform:scale(.97)}
  .mission .em{font-size:52px;line-height:1;filter:drop-shadow(0 4px 0 #0008)}
  .mission h3{font-family:'Bungee';font-size:16px;margin-top:12px;line-height:1.2}
  .mission p{color:var(--muted);font-weight:600;font-size:14px;margin-top:6px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .chip{font-weight:800;font-size:12px;padding:3px 9px;border-radius:99px;background:#ffffff14}
  .chip.xp{background:var(--yellow);color:#2a1d00}
  .chip.cam{background:var(--cyan);color:#00222a}
  .mission.done{border-color:var(--lime);box-shadow:0 0 22px -6px var(--lime);background:linear-gradient(160deg,#173a1c,#0d2411)}
  .mission.done .em{filter:grayscale(.2) drop-shadow(0 4px 0 #0008)}
  .stamp{position:absolute;top:14px;right:-38px;transform:rotate(35deg);background:var(--lime);color:#0b2a0a;
    font-family:'Bungee';font-size:12px;padding:4px 44px;letter-spacing:1px}
  .mission.busy{opacity:.6;pointer-events:none}
  .spin{position:absolute;right:14px;bottom:14px;font-size:24px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Insignias */
  .badges{display:flex;gap:12px;flex-wrap:wrap}
  .badge{width:118px;text-align:center;padding:12px 8px;border-radius:20px;background:#ffffff0c;border:2px dashed #ffffff26}
  .badge.on{border:2px solid var(--yellow);background:linear-gradient(160deg,#3a2c00,#1d1600);box-shadow:0 0 18px -4px var(--yellow)}
  .badge .bi{font-size:34px}
  .badge .bn{font-family:'Bungee';font-size:11px;margin-top:6px;line-height:1.2}
  .badge:not(.on){filter:grayscale(1);opacity:.45}

  .footer{text-align:center;color:var(--muted);font-weight:700;margin-top:34px;font-size:13px}

  /* Toast */
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);
    background:var(--ink);color:#0b0620;font-weight:800;padding:12px 18px;border-radius:16px;
    box-shadow:0 12px 30px #0009;transition:transform .35s cubic-bezier(.2,1.2,.3,1);z-index:50;max-width:92vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--pink);color:#fff}

  /* Panel de padres */
  .panel-card{background:var(--panel);border:2px solid #ffffff1a;border-radius:24px;padding:18px;margin-top:14px}
  table{width:100%;border-collapse:collapse;font-weight:700}
  th,td{padding:10px 8px;text-align:left;border-bottom:1px solid #ffffff14;font-size:14px}
  th{color:var(--muted);font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
  .heat div{aspect-ratio:1;border-radius:8px;background:#ffffff10;font-size:10px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;color:#fff9}
  .input{width:100%;padding:14px;border-radius:14px;border:2px solid #ffffff33;background:#0a0420;color:var(--ink);
    font-family:'Baloo 2';font-size:20px;font-weight:800;text-align:center;letter-spacing:6px}
  .btn{background:var(--cyan);color:#00222a;border:0;border-radius:14px;padding:12px 18px;font-family:'Bungee';font-size:14px;cursor:pointer}
  .btn.ghost{background:none;color:var(--muted);border:2px solid #ffffff33;font-family:'Baloo 2';font-weight:800}
  .hidden{display:none !important}
  .photo-input{display:none}
</style>
</head>
<body>
<div class="app">

  <header class="brand">
    <span class="kicker">⚡ MISIÓN DIARIA ⚡</span>
    <h1>MISIONES</h1>
    <p>Base de entrenamiento · Frank & Valentina</p>
  </header>

  <!-- PANTALLA: quién juega -->
  <section id="v-pick">
    <div class="pick-title">¿QUIÉN ESTÁ EN SERVICIO?</div>
    <div class="pick-grid" id="pick-grid"></div>
  </section>

  <!-- PANTALLA: misiones del niño -->
  <section id="v-play" class="hidden">
    <div class="topbar" id="topbar"></div>

    <div class="section-h" style="--c:var(--lime)">🎯 MISIONES DE HOY</div>
    <div class="missions" id="missions"></div>

    <div class="section-h" style="--c:var(--yellow)">🏆 INSIGNIAS</div>
    <div class="badges" id="badges"></div>
  </section>

  <!-- PANTALLA: panel de padres -->
  <section id="v-panel" class="hidden">
    <div class="section-h" style="--c:var(--pink)">🛰️ CENTRO DE MANDO</div>
    <div id="panel-gate" class="panel-card" style="max-width:360px;margin:0 auto">
      <p style="text-align:center;font-weight:800;margin-bottom:12px">Ingresa el PIN de comandante</p>
      <input id="pin" class="input" type="password" inputmode="numeric" maxlength="6" placeholder="••••" />
      <div style="display:flex;gap:10px;margin-top:12px">
        <button class="btn" id="pin-go" style="flex:1">ENTRAR</button>
        <button class="btn ghost" id="pin-back">VOLVER</button>
      </div>
    </div>
    <div id="panel-body" class="hidden"></div>
  </section>

  <div class="footer" id="footer"></div>
</div>

<input type="file" id="photo" class="photo-input" accept="image/*" capture="environment" />
<div class="toast" id="toast"></div>

<script>
/* ============ CONFIGURACIÓN ============ */
const SUPABASE_URL = 'https://wrjftbbliognkgemmzsn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_B3orSsvBirHhnRFfWsEgxQ_jrk_0blW';   // clave pública (segura en el navegador)
const PANEL_PIN = '1234';                                                     // ⚠️ cámbialo por tu PIN
/* ======================================= */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy = () => new Date().toLocaleDateString('en-CA');              // YYYY-MM-DD local (Bogotá)
const LEVEL_XP = 100;

const state = { ninos: [], misiones: [], nino: null, completados: [], busy: false, pendingMision: null };

function toast(msg, err=false){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err?' err':'');
  clearTimeout(toast._t); toast._t = setTimeout(()=> t.className='toast', 2600);
}
function show(id){ ['v-pick','v-play','v-panel'].forEach(v => $('#'+v).classList.toggle('hidden', v!==id)); window.scrollTo({top:0,behavior:'smooth'}); }

/* ============ DATOS ============ */
async function loadBase(){
  const [n, m] = await Promise.all([
    sb.from('ninos').select('*').order('creado_at'),
    sb.from('misiones').select('*').eq('activa', true).order('orden')
  ]);
  if (n.error || m.error) throw (n.error || m.error);
  state.ninos = n.data; state.misiones = m.data;
}
async function loadCompletados(ninoId){
  const desde = new Date(); desde.setDate(desde.getDate() - 60);
  const { data, error } = await sb.from('completados').select('*')
    .eq('nino_id', ninoId).gte('fecha', desde.toLocaleDateString('en-CA'));
  if (error) throw error;
  state.completados = data;
}

/* ============ CÁLCULOS ============ */
function xpTotal(){
  return state.completados.reduce((acc, c) => {
    const m = state.misiones.find(x => x.id === c.mision_id); return acc + (m?.xp || 0);
  }, 0);
}
function rachaDias(){
  const dias = new Set(state.completados.map(c => c.fecha));
  let d = new Date(); let n = 0;
  if (!dias.has(hoy())) d.setDate(d.getDate()-1);           // si hoy aún no hace nada, la racha sigue de ayer
  while (dias.has(d.toLocaleDateString('en-CA'))) { n++; d.setDate(d.getDate()-1); }
  return n;
}
const INSIGNIAS = [
  { id:'primera', icon:'🥇', nombre:'Primera Misión', cond: s => s.total >= 1 },
  { id:'racha3',  icon:'🔥', nombre:'Racha x3', cond: s => s.racha >= 3 },
  { id:'racha7',  icon:'🚀', nombre:'Semana Perfecta', cond: s => s.racha >= 7 },
  { id:'nivel3',  icon:'⚡', nombre:'Nivel 3', cond: s => s.nivel >= 3 },
  { id:'nivel5',  icon:'👑', nombre:'Leyenda', cond: s => s.nivel >= 5 },
  { id:'loza',    icon:'🍽️', nombre:'Rey de la Loza', cond: s => s.porMision.get('Misión Loza') >= 5 },
  { id:'tablas',  icon:'🧠', nombre:'Genio de Tablas', cond: s => s.porMision.get('Laboratorio de Tablas') >= 5 },
];

/* ============ PANTALLA: SELECCIÓN ============ */
function renderPick(){
  $('#pick-grid').innerHTML = state.ninos.map(n => `
    <div class="hero" style="--c:${esc(n.color)}" data-id="${n.id}">
      <span class="tag">JUGADOR</span>
      <div class="av">${esc(n.avatar)}</div>
      <div class="nm">${esc(n.nombre.toUpperCase())}</div>
      <div class="sub">Toca para entrar a tu base</div>
    </div>`).join('');
  document.querySelectorAll('.hero').forEach(el => el.onclick = () => entrar(el.dataset.id));
}

async function entrar(id){
  state.nino = state.ninos.find(n => n.id === id);
  await loadCompletados(id);
  show('v-play'); renderPlay();
}

/* ============ PANTALLA: JUGAR ============ */
function renderPlay(){
  const n = state.nino;
  const xp = xpTotal();
  const nivel = Math.floor(xp / LEVEL_XP) + 1;
  const enNivel = xp % LEVEL_XP;
  const racha = rachaDias();
  state.nivel = nivel; state.racha = racha;

  $('#topbar').style.setProperty('--c', n.color);
  $('#topbar').innerHTML = `
    <div class="av">${esc(n.avatar)}</div>
    <div class="info">
      <div class="hi">¡Hola, ${esc(n.nombre)}!</div>
      <div class="lvl">NIVEL ${nivel} · ${xp} XP</div>
      <div class="xpbar"><div class="xpfill" style="width:${enNivel}%"></div></div>
    </div>
    <div class="streak"><b>${racha}</b><span>🔥 racha</span></div>
    <button class="switch" id="switch">Cambiar</button>`;
  $('#switch').onclick = () => { state.nino=null; show('v-pick'); renderPick(); };
  setTimeout(()=>{ const f=document.querySelector('.xpfill'); if(f) f.style.width = enNivel+'%'; }, 50);

  const hoyDone = new Map(state.completados.filter(c=>c.fecha===hoy()).map(c=>[c.mision_id,c]));
  $('#missions').innerHTML = state.misiones.map(m => {
    const done = hoyDone.has(m.id);
    return `
    <div class="mission ${done?'done':''}" style="--c:${esc(n.color)}" data-m="${m.id}">
      ${done ? '<div class="stamp">¡LISTO!</div>' : ''}
      <div class="em">${esc(m.emoji)}</div>
      <h3>${esc(m.nombre)}</h3>
      <p>${esc(m.descripcion)}</p>
      <div class="chips">
        <span class="chip xp">+${m.xp} XP</span>
        ${m.requiere_foto ? '<span class="chip cam">📸 pide foto</span>' : ''}
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('.mission').forEach(el => el.onclick = () => tocarMision(Number(el.dataset.m)));

  // Insignias
  const porMision = new Map();
  state.completados.forEach(c => {
    const m = state.misiones.find(x=>x.id===c.mision_id);
    if (m) porMision.set(m.nombre, (porMision.get(m.nombre)||0)+1);
  });
  const stats = { total: state.completados.length, racha, nivel, porMision };
  $('#badges').innerHTML = INSIGNIAS.map(b => {
    const on = b.cond(stats);
    return `<div class="badge ${on?'on':''}"><div class="bi">${b.icon}</div><div class="bn">${esc(b.nombre)}</div></div>`;
  }).join('');
}

async function tocarMision(misionId){
  if (state.busy) return;
  const m = state.misiones.find(x=>x.id===misionId);
  const n = state.nino;
  const reg = state.completados.find(c => c.mision_id===misionId && c.fecha===hoy());
  state.busy = true;

  try {
    if (reg){
      // Deshacer (por si tocó sin querer)
      const { error } = await sb.from('completados').delete().eq('id', reg.id);
      if (error) throw error;
      state.completados = state.completados.filter(c => c.id !== reg.id);
      toast(`Misión "${m.nombre}" desmarcada`);
      return renderPlay();
    }

    if (m.requiere_foto){
      state.pendingMision = misionId;
      $('#photo').click();          // el cambio de archivo completa el registro
      state.busy = false;
      return;
    }
    await registrar(m, null);
  } catch (e) {
    console.error(e); toast('Algo falló, intenta de nuevo', true);
  } finally { if (!state.pendingMision) state.busy = false; }
}

async function registrar(m, fotoUrl){
  const n = state.nino;
  const fecha = hoy();
  const { data, error } = await sb.from('completados').insert({
    nino_id: n.id, mision_id: m.id, fecha, foto_url: fotoUrl
  }).select().single();
  if (error) throw error;
  state.completados.push(data);
  renderPlay();
  lanzarConfetti(n.color);
  toast(`+${m.xp} XP · ¡${m.nombre} completada! 🎉`);
}

$('#photo').addEventListener('change', async (ev) => {
  const file = ev.target.files[0]; ev.target.value = '';
  const misionId = state.pendingMision; state.pendingMision = null;
  if (!file || !misionId){ state.busy=false; return; }
  const m = state.misiones.find(x=>x.id===misionId);
  const n = state.nino;
  try{
    toast('Subiendo tu prueba... 📸');
    const path = `${n.id}/${hoy()}/${misionId}-${Date.now()}.jpg`;
    const { error: upErr } = await sb.storage.from('pruebas').upload(path, file, { contentType: file.type || 'image/jpeg' });
    if (upErr) throw upErr;
    const { data: pub } = sb.storage.from('pruebas').getPublicUrl(path);
    await registrar(m, pub.publicUrl);
  } catch(e){
    console.error(e); toast('No se pudo subir la foto', true);
  } finally { state.busy = false; }
});

function lanzarConfetti(color){
  if (typeof confetti !== 'function') return;
  const colors = [color, '#ffd60a', '#b6ff3b', '#ff3d7f', '#00e5ff'];
  confetti({ particleCount: 140, spread: 80, origin: { y: .45 }, colors });
  setTimeout(()=> confetti({ particleCount: 60, angle: 60, spread: 55, origin: { x: 0 }, colors }), 220);
  setTimeout(()=> confetti({ particleCount: 60, angle: 120, spread: 55, origin: { x: 1 }, colors }), 220);
}

/* ============ PANEL DE PAPÁ ============ */
$('#pin-go').onclick = async () => {
  if ($('#pin').value !== PANEL_PIN){ toast('PIN incorrecto', true); $('#pin').value=''; return; }
  $('#panel-gate').classList.add('hidden');
  $('#panel-body').classList.remove('hidden');
  await renderPanel();
};
$('#pin-back').onclick = () => { show('v-pick'); renderPick(); };

async function renderPanel(){
  const desde = new Date(); desde.setDate(desde.getDate() - 6);
  const { data: rows, error } = await sb.from('completados')
    .select('nino_id, mision_id, fecha, foto_url, created_at').gte('fecha', desde.toLocaleDateString('en-CA'))
    .order('created_at', { ascending: false });
  if (error){ toast('No pude cargar el panel', true); return; }

  const misionMap = new Map(state.misiones.map(m => [m.id, m]));
  const hoyRows = rows.filter(r => r.fecha === hoy());

  const resumen = state.ninos.map(n => {
    const mine = rows.filter(r => r.nino_id === n.id);
    const xp = mine.reduce((a,r)=> a + (misionMap.get(r.mision_id)?.xp||0), 0);
    const dias = new Set(mine.map(r=>r.fecha));
    const hoyN = hoyRows.filter(r=>r.nino_id===n.id).length;
    return { n, xp, semana: mine.length, dias: dias.size, hoy: hoyN, mine };
  });

  const total = state.misiones.length;
  const cards = resumen.map(({n, xp, semana, dias, hoy:h, mine}) => {
    const pct = Math.round((h / total) * 100);
    const heat = [...Array(7)].map((_,i) => {
      const d = new Date(); d.setDate(d.getDate() - (6-i));
      const key = d.toLocaleDateString('en-CA');
      const c = mine.filter(r=>r.fecha===key).length;
      const alpha = c===0 ? '10' : c<3 ? '66' : 'cc';
      return `<div style="background:${esc(n.color)}${alpha}" title="${key}: ${c}">${d.getDate()}</div>`;
    }).join('');
    return `
    <div class="panel-card" style="border-color:${esc(n.color)}88">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="font-size:44px">${esc(n.avatar)}</div>
        <div style="flex:1">
          <div class="bungee" style="color:${esc(n.color)};font-size:20px">${esc(n.nombre)}</div>
          <div style="color:var(--muted);font-weight:700;font-size:14px">${xp} XP esta semana · ${dias}/7 días activos</div>
        </div>
        <div style="text-align:right">
          <div class="bungee" style="font-size:28px;color:var(--lime)">${h}/${total}</div>
          <div style="color:var(--muted);font-size:12px;font-weight:700">HOY · ${pct}%</div>
        </div>
      </div>
      <div class="heat">${heat}</div>
    </div>`;
  }).join('');

  const fotos = rows.filter(r => r.foto_url).slice(0, 12);
  const galeria = fotos.length ? `
    <div class="panel-card">
      <div class="bungee" style="font-size:16px;margin-bottom:10px">📸 ÚLTIMAS PRUEBAS</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px">
        ${fotos.map(f => `<a href="${esc(f.foto_url)}" target="_blank" rel="noopener">
          <img src="${esc(f.foto_url)}" alt="" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:2px solid #ffffff22" />
          <div style="font-size:11px;color:var(--muted);font-weight:700;margin-top:4px">${esc(state.ninos.find(n=>n.id===f.nino_id)?.nombre)} · ${esc(misionMap.get(f.mision_id)?.nombre)}</div>
        </a>`).join('')}
      </div>
    </div>` : '';

  const bitacora = rows.slice(0, 30).map(r => {
    const n = state.ninos.find(x=>x.id===r.nino_id); const m = misionMap.get(r.mision_id);
    return `<tr>
      <td>${esc(r.fecha)}</td>
      <td><span class="dot" style="background:${esc(n?.color)}"></span>${esc(n?.nombre)}</td>
      <td>${esc(m?.emoji)} ${esc(m?.nombre)}</td>
      <td style="color:var(--yellow)">+${m?.xp||0}</td>
      <td>${r.foto_url ? '📸' : '—'}</td></tr>`;
  }).join('');

  $('#panel-body').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin:4px 0 6px">
      <div style="color:var(--muted);font-weight:800">Semana del ${esc(desde.toLocaleDateString('es-CO',{day:'numeric',month:'short'}))} a hoy</div>
      <button class="btn ghost" id="panel-exit">Salir</button>
    </div>
    ${cards}
    ${galeria}
    <div class="panel-card">
      <div class="bungee" style="font-size:16px;margin-bottom:6px">📜 BITÁCORA</div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Fecha</th><th>Quién</th><th>Misión</th><th>XP</th><th>Foto</th></tr></thead>
        <tbody>${bitacora || '<tr><td colspan="5" style="color:var(--muted)">Todavía no hay misiones esta semana</td></tr>'}</tbody>
      </table></div>
    </div>`;
  $('#panel-exit').onclick = () => { show('v-pick'); renderPick(); $('#panel-gate').classList.remove('hidden'); $('#panel-body').classList.add('hidden'); $('#pin').value=''; };
}

/* ============ ARRANQUE ============ */
(async function init(){
  $('#footer').textContent = 'Hecho con 💜 para Frank y Valentina · ' + new Date().getFullYear();
  if (location.hash === '#panel'){ show('v-panel'); }
  else show('v-pick');
  try{
    await loadBase();
    renderPick();
  } catch(e){
    console.error(e);
    $('#pick-grid').innerHTML = '<p style="text-align:center;color:var(--pink);font-weight:800">No pude conectar con la base. Revisa la configuración.</p>';
  }
  $('#pin').addEventListener('keydown', e => { if (e.key==='Enter') $('#pin-go').click(); });
})();
</script>
</body>
</html>
